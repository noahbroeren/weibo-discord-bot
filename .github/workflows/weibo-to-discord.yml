name: Weibo to Discord

on:
  schedule:
    # Elke 10 minuten. GitHub kan dit bij drukte iets vertragen,
    # maar dit is de praktische ondergrens voor gratis Actions-cron.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_latest:
        description: "Plaats de X nieuwste posts sowieso (0 = normaal gedrag)"
        required: false
        default: "0"
        type: choice
        options: ["0", "1", "2", "3", "5"]

permissions:
  contents: write   # nodig om state.json / products.json terug te committen

concurrency:
  group: weibo-to-discord
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WEIBO_UID: "5780980302"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Alleen nodig als Weibo het runner-IP blokkeert; zie README
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          # Wordt gevuld door de keuzelijst bij een handmatige run
          FORCE_LATEST: ${{ inputs.force_latest }}
          # Optioneel: ander model kiezen zonder de code aan te passen
          # ANTHROPIC_MODEL: "claude-sonnet-5"
                run: python -u main.py

      - name: Commit updated state
        run: |
          git config user.name "weibo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json products.json
          git diff --cached --quiet || git commit -m "chore: update bot state"
          git push
